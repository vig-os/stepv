# Seeded by vigOS devkit — yours to edit; upgrades never overwrite this file.
# Bugs / missing tools: https://github.com/vig-os/devkit/issues

# Typos configuration
# https://github.com/crate-ci/typos

[default.extend-words]
# Shell scripting: sed label syntax uses 'ba' (branch to label 'a')
ba = "ba"
# CVE policy term (#637): a finding "unexcepted" = not in the exception register
unexcepted = "unexcepted"
# version-check.sh duration placeholder (#759): 'Nd' = N days (cf. Nw/Nh/Nm)
Nd = "Nd"
# podman rootless-networking helper package name (#1106), not a misspelling
passt = "passt"
# Vendored guardrails gates (#1488). All three are false positives in shell:
# `tatus` is the tail of the regex class `[Ss]tatus:`, `fnd` is a shell
# function name in the test harness, and `mis-attributes` is a real word.
# Added as words rather than excluding assets/guardrails/ wholesale, so the
# prose in those files stays spell-checked.
tatus = "tatus"
fnd = "fnd"
mis = "mis"
# OCCT API names (stepv). `CAF` is OpenCascade's Common Application
# Framework — it appears in `STEPCAFControl_Reader`, `RWGltf_CafWriter`,
# `XCAFDoc_*` and in prose about that layer. typos reads it as a misspelling
# of "calf". Added as words rather than excluding plan.md wholesale, so the
# surrounding prose stays spell-checked.
CAF = "CAF"
Caf = "Caf"
# freedesktop term (stepv, packaging/linux): a "thumbnailer" is the program a
# file manager runs to make thumbnails; plural "thumbnailers", not "thumbnails".
thumbnailers = "thumbnailers"
