[package]
name = "stepv"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
description = "Fast STEP/IGES/BREP preview and thumbnails for macOS Quick Look and Linux file managers"
repository = "https://github.com/vig-os/stepv"
homepage = "https://github.com/vig-os/stepv"
license = "Apache-2.0"
keywords = ["cad", "step", "opencascade", "quicklook", "thumbnail"]
readme = "README.md"
# What crates.io gets: the CLI and library, the kernel's C++ sources (you build
# the kernel against your own OCCT: cmake -S kernel -B build), the Linux desktop
# files for packagers, the committed test corpus, and the licence texts. Not
# the devkit scaffolding, the macOS app sources, or the C ABI crate.
include = [
  "/src",
  "/kernel",
  "/packaging/linux",
  "/tests/cli.rs",
  "/tests/view.rs",
  "/tests/data",
  "/examples/harness.rs",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/NOTICE",
  "/licenses",
]
categories = ["command-line-utilities", "graphics"]

# The library + CLI crate. plan.md §"Crate layout" deferred any split until a
# SECOND consumer of the library appeared; it has — the Swift Quick Look
# extensions, which cannot exec the CLI — so the C ABI they link is its own
# workspace member, capi/ (stepv-capi). The library stays here rather than in
# a separate stepv-core: one crate on crates.io, no extra publish to keep
# in step.
[workspace]
members = [".", "capi"]

[lib]
name = "stepv"
path = "src/lib.rs"

[[bin]]
name = "stepv"
path = "src/main.rs"

[dependencies]
# ── Kernel ────────────────────────────────────────────────────────────
# Plan B (plan.md §3): native OCCT in a subprocess, kernel/stepv-occt.cpp,
# driven by src/occt.rs. No Rust dependency on OCCT at all.
#
# Plan A (`occt-wasm`) was tried in S1 and failed its gate: the crates.io
# 4.0.0 cannot instantiate its own module, and on upstream main STEP import
# traps because the standalone WASI build has no filesystem. See plan.md §5
# "S1 result" before re-adding it.

# The kernel's JSON summary, `--info`, and glTF's JSON chunk.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Content-addressed cache keys over (path, size, mtime). Same hash function
# cxad uses for its node store, so a future shared cache needs no migration.
blake3 = "1"

# The graph core (ADR-0001 §2.1): the STEP file is memory-mapped and scanned
# in place, so the entity table points into the file instead of copying it.
# Already locked at this version through the viewer's windowing (winit);
# MIT/Apache-2.0, no dependencies beyond libc.
memmap2 = "0.9.11"

# `stepv graph query` (ADR-0001 §2.4, G5): jq filters over the graph's lazy
# JSON view. Pinned to exact versions: jaq's native-filter API is what the
# view is built on, so an upgrade is a deliberate change. MIT. Behind the
# default-on `query` feature, so the Quick Look library carries no query
# engine.
jaq-core = { version = "=3.1.2", optional = true }
# The whole standard library (its definitions call every native); the view
# refuses `env`, `halt` and the logging natives (src/graph/query.rs).
jaq-std = { version = "=3.0.4", optional = true }
jaq-json = { version = "=2.0.3", optional = true, default-features = false, features = ["std", "serde"] }

# PNG encoding for `--png` (the rasteriser itself is src/render.rs).
png = "0.18"

# `stepv view --software`, and the fallback when there is no GPU adapter: a
# window over the software rasteriser. Pure Rust; on Linux it dlopens
# X11/Wayland at run time, so building it needs no system libraries.
minifb = { version = "0.29", optional = true }

# `stepv view` on a GPU (#21, #27's verdict: egui + wgpu). Pinned to exact
# minors: egui and wgpu break their APIs every release (#27 hit three renames),
# so an upgrade is a deliberate change, not a `cargo update`. eframe brings
# egui, egui-wgpu and wgpu; we name wgpu through its re-export so there is
# exactly one copy. No accesskit or persistence: nothing to store, and
# accesskit doubles the dependency tree.
eframe = { version = "=0.36.2", optional = true, default-features = false, features = [
  "wgpu",
  "default_fonts",
  "wayland",
  "x11",
] }
# Icons for the toolbar (Phosphor: tracks egui's minors).
egui-phosphor = { version = "=0.14.0", optional = true }
# Plain-old-data casts for the GPU buffers.
bytemuck = { version = "1", optional = true, features = ["derive"] }
# Blocks on wgpu's async adapter request (the probe before the window opens,
# and the headless renderer the tests use).
pollster = { version = "1", optional = true }

[features]
default = ["viewer", "query"]
# `stepv graph query`: jaq over the graph (ADR-0001 §2.4).
query = ["dep:jaq-core", "dep:jaq-std", "dep:jaq-json"]
# `stepv view`: the GPU viewer, and the software window it falls back to. Off
# for a headless build (`--no-default-features`): thumbnails and --glb need no
# window, and the Quick Look extensions (stepv-capi) must never link it (CI's
# capi tripwire, scripts/check-capi-deps.sh).
viewer = ["dep:minifb", "dep:eframe", "dep:egui-phosphor", "dep:bytemuck", "dep:pollster"]

# `stepv graph query` is tested with the rest of `stepv graph`.
[[test]]
name = "graph_cli"
required-features = ["query"]

# proc_pid_rusage: the macOS half of the kernel memory cap; fcntl: handing
# the kernel an fd input (src/occt.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The graph's test oracle (src/graph/tests.rs): ids and types from a regex
# pass, independent of the scanner.
regex = "1"
# Validates `--glb` output against the glTF 2.0 schema in tests.
gltf = "1"
# tests/cache.rs: dlopen the kernel's C library to call it with arguments
# the CLI never passes, and geteuid to skip a mode-bit test as root.
libc = "0.2"

[profile.release]
# A previewer is latency-bound, not throughput-bound: `lto = "thin"` is the
# cxad setting and keeps the link fast enough to stay pleasant to iterate on.
lto = "thin"
