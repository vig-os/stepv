# Seeded by vigOS devkit — yours to edit; upgrades never overwrite this file.
# Bugs / missing tools: https://github.com/vig-os/devkit/issues

name: Prepare Release Extension

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      version:
        description: "Release version being prepared (X.Y.Z)"
        required: true
        type: string
      release_branch:
        description: "Release branch just created (release/X.Y.Z)"
        required: true
        type: string
      branch_sha:
        description: "Post-freeze head SHA the release branch was created from"
        required: true
        type: string
      dry_run:
        description: "Validate without making changes (extensions must honor it)"
        required: false
        default: false
        type: boolean

# The orchestrator calls this workflow with `secrets: inherit`, so a real
# extension can mint the COMMIT_APP token to push to the write-protected release
# branch — the same bypass the changelog-freeze commit already uses.
permissions:
  contents: read

jobs:
  # stepv: put the release version into the crate manifests and the lockfile
  # on the release branch. devkit's prepare step freezes CHANGELOG.md but does
  # not know about Cargo.toml; without this every release would ship 0.0.0.
  bump-version:
    name: Bump crate versions
    runs-on: ubuntu-26.04
    steps:
      - name: Generate Commit App Token
        id: token
        if: ${{ !inputs.dry_run }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          client-id: ${{ secrets.COMMIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.COMMIT_APP_PRIVATE_KEY }}

      - name: Checkout the release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.release_branch }}
          persist-credentials: false

      - name: Set the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/set-version.py "$VERSION"
          git diff --stat

      - name: Commit the version to the release branch via API
        if: ${{ !inputs.dry_run }}
        uses: vig-os/commit-action@7ba7e1ae17547813e708d4cc6a771a09f978f724  # v0.3.3
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: refs/heads/${{ inputs.release_branch }}
          MAX_ATTEMPTS: "3"
          COMMIT_MESSAGE: |-
            chore(release): set crate versions to ${{ inputs.version }}

            stepv's prepare-release extension: Cargo.toml, capi/Cargo.toml and
            Cargo.lock, which devkit's changelog freeze does not cover.
          FILE_PATHS: Cargo.toml capi/Cargo.toml Cargo.lock
