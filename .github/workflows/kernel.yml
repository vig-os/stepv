# Kernel and product CI (vig-os/stepv#11). Project-owned, not devkit-managed.
#
# devkit's ci.yml builds the dev shell and runs `just test`, but it never runs
# `nix flake check` and its hook set has no rustfmt/clippy (vig-os/devkit#1811),
# and nothing there builds the OCCT kernel or exercises it on real files. This
# workflow does, on both shipping platforms:
#
#   1. nix build: the product (CLI + kernel + Linux integration), the kernel
#      alone, and on Linux the KF6 Dolphin plugin;
#   2. nix flake check: fmt, clippy, nextest (the CLI tests run the REAL
#      kernel and fail without it), doctests, docs;
#   3. the robustness gate on the REDISTRIBUTABLE corpus only (NIST PMI is US
#      government work; `malformed` is generated): `harness --strict` fails
#      on any crash/timeout/bad mesh or a malformed file that does not fail
#      cleanly, `--min-pass` on a pass-rate collapse (#22), and `cli-sweep`
#      holds the CLI to its exit-code contract;
#   4. on Linux, the desktop integration exactly as GNOME/XFCE invoke it.
name: Kernel

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: Kernel (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1

      - name: Build the product and the kernel
        run: nix build --print-build-logs .#default .#kernel

      - name: Closure size of the product (nix)
        if: runner.os == 'Linux'
        # #32: stepv view's runtime libraries (vulkan-loader, libGL,
        # libxkbcommon, X11, Wayland) are now in the product's closure. Here,
        # straight after the build and on the path it printed: later steps
        # fetch the corpus into tests/fixtures, which is part of the flake's
        # source, so `.#default` would name a different, unbuilt derivation.
        run: |
          out=$(nix build --no-link --print-out-paths .#default)
          nix path-info --closure-size --human-readable "$out"
          bytes=$(nix path-info --closure-size --json "$out" | python3 -c 'import json,sys; d=json.load(sys.stdin); v=d if isinstance(d, list) else list(d.values()); print(v[0]["closureSize"])')
          echo "closure: $((bytes / 1048576)) MiB"
          [ "$bytes" -le $((1536 * 1048576)) ] || { echo "the product closure is over 1.5 GiB"; exit 1; }

      - name: Build the Dolphin thumbnail plugin
        if: runner.os == 'Linux'
        run: nix build --print-build-logs .#kde-thumbnailer

      - name: nix flake check
        run: nix flake check --print-build-logs

      - name: Sandbox tests, outside nix's build sandbox
        # On macOS, flake check runs inside nix's own Seatbelt sandbox, which
        # the kernel's cannot nest in: it reports `macos-outer` there and the
        # sandbox tests step aside, saying so. Here they run for real (#18).
        run: nix develop --command sh -c 'just kernel && cargo test --test sandbox --test cli'

      - name: cargo deny check advisories
        if: runner.os == 'Linux'
        # The one cargo-deny check the nix sandbox cannot run (it fetches the
        # RustSec database); bans/licenses/sources run inside flake check.
        run: nix develop --command cargo deny check advisories

      - name: Fetch the redistributable corpus
        run: nix develop --command just fixtures nist-pmi malformed

      - name: Robustness gate (harness --strict)
        run: nix develop --command just harness --strict --min-pass 95 tests/fixtures/nist-pmi tests/fixtures/malformed tests/data

      - name: CLI contract sweep
        run: nix develop --command just cli-sweep tests/fixtures/nist-pmi tests/fixtures/malformed tests/data

      - name: macOS app (Quick Look extensions) and its headless checks
        if: runner.os == 'macOS'
        # The Quick Look round trip (--quicklook) needs a logged-in session to
        # register extensions; it runs locally via `just macos-test --quicklook`.
        run: nix develop --command just macos-test

      - name: capi tripwire (no viewer stack in the Quick Look library)
        # #28: libstepv_capi.a must never carry eframe, egui, winit, wgpu,
        # naga or minifb. Checks the dependency graph and the built archive's
        # symbols (the macOS step above built it; on Linux the script does).
        run: nix develop --command just capi-tripwire

      - name: GPU viewer on Metal
        if: runner.os == 'macOS'
        # The renderer's headless tests against the real kernel, then real
        # windows: both themes, --software, the fallbacks, a click, and
        # --frames on every fixture (#28, #32). STEPV_REQUIRE_GPU makes a
        # missing adapter a failure, not a skip. The runner never presents a
        # window, so screenshots are the viewport's render here; the Linux
        # viewer job checks whole windows. Then the size budget (#32).
        env:
          STEPV_REQUIRE_GPU: "1"
        run: |
          nix develop --command just view-test
          scripts/check-size.sh target/release/stepv 16

      - name: Linux release tarball, proven on distros without nix
        if: runner.os == 'Linux'
        # The release artefact: binaries + every library + nix's own loader,
        # started through it, so no FUSE, no user namespaces (Ubuntu 24.04+
        # forbids those, which is why an AppImage was dropped), no glibc
        # dependency. Unpacked and exercised in debian:11, ubuntu:22.04,
        # ubuntu:24.04 and fedora:41 containers, none of which has /nix.
        run: |
          nix build .#default -o result
          nix develop --command scripts/package-linux.sh result ci
          scripts/test-linux-tarball.sh dist/stepv-ci-*-linux.tar.gz

      - name: Linux desktop integration
        if: runner.os == 'Linux'
        run: |
          nix shell .#default nixpkgs#shared-mime-info nixpkgs#desktop-file-utils nixpkgs#python3 \
            --command scripts/test-linux-integration.sh

  viewer-linux:
    # #32: stepv view on Linux without a GPU: Mesa's lavapipe and Xvfb in a
    # Debian container (scripts/test-linux-viewer.sh, also `just
    # linux-view-test`). The renderer's tests with an adapter required; real,
    # presented windows (whole-window screenshots required) with both
    # themes, the fallbacks and a click; --frames on every fixture on
    # Vulkan; the 24 MB size budget; then the GPU drivers deleted, and the
    # viewer must fall back to software and say so.
    name: Viewer (Linux, lavapipe)
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Viewer on lavapipe and Xvfb, then with no GPU at all
        env:
          CARGO_BUILD_JOBS: "4"
        run: scripts/test-linux-viewer.sh
