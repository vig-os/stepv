# cargo-deny (vig-os/stepv#13). mkRustProject runs `cargo deny check` on this
# in `nix flake check` with crane's default checks — bans, licenses, sources —
# which need no network. `advisories` needs the RustSec database, which the
# nix build sandbox cannot fetch, so it runs in .github/workflows/kernel.yml
# instead, with network.

[graph]
all-features = true

[advisories]
# Unmaintained crates are reported, not fatal: a previewer depends on a few
# small, stable crates, and an "unmaintained" flag is a prompt to look, not a
# vulnerability.
unmaintained = "workspace"

[licenses]
# Everything stepv links is permissive. Anything else must be a deliberate
# decision recorded here, not a dependency bump that slipped through.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
  # #28, the GPU viewer: clipboard-win (arboard, egui's clipboard; Windows
  # only) is Boost-licensed, permissive.
  "BSL-1.0",
  # #28: the fonts egui embeds in `stepv view` (epaint_default_fonts):
  # Noto Emoji under the SIL Open Font License, Ubuntu Light under the
  # Ubuntu Font Licence. Both allow embedding and redistribution with the
  # licence text, which ships in licenses/ (NOTICE lists them).
  "OFL-1.1",
  "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies (stepv-capi -> stepv) are not wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
